<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Status Overlay</title>
  <style>
    /* 한국어 주석: 보라색 크로마키 배경 */
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #7a00ff;
      overflow: hidden;
    }

    /* 한국어 주석: 전체 클릭 영역 */
    .wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      position: relative;
    }

    /* 한국어 주석: 이미지 두 장을 겹쳐서 페이드 교차 */
    img {
      position: absolute;
      max-width: 100%;
      max-height: 100%;
      display: block;
      transition: opacity 0.35s ease-in-out; /* 전환 속도 */
      -webkit-user-drag: none;
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
    }

    .visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="wrap" id="wrap">
    <img id="imgA" class="visible" />
    <img id="imgB" class="hidden" />
  </div>

  <script>
    // 한국어 주석: 네가 준 GitHub raw 이미지 URL
    const files = [
      "https://raw.githubusercontent.com/yunrang2/upload/refs/heads/master/보고있음.png",
      "https://raw.githubusercontent.com/yunrang2/upload/refs/heads/master/자리비움.png",
      "https://raw.githubusercontent.com/yunrang2/upload/refs/heads/master/오프라인.png"
    ];

    const storageKey = "status_image_idx_v2";
    const wrap = document.getElementById("wrap");
    const imgA = document.getElementById("imgA");
    const imgB = document.getElementById("imgB");

    function getIdx(){
      const v = localStorage.getItem(storageKey);
      const n = Number(v);
      return Number.isInteger(n) && n >= 0 && n < files.length ? n : 0;
    }

    function setIdx(i){
      localStorage.setItem(storageKey, String(i));
    }

    function nextIdx(){
      return (getIdx() + 1) % files.length;
    }

    // 한국어 주석: 초기 이미지 로드
    let currentIdx = getIdx();
    imgA.src = files[currentIdx] + "?t=" + Date.now();

    // 클릭 시 페이드 전환
    wrap.addEventListener("click", () => {
      const newIdx = nextIdx();
      const nextImg = imgB.classList.contains("hidden") ? imgB : imgA;
      const currentImg = nextImg === imgA ? imgB : imgA;

      // 새 이미지 미리 로드
      nextImg.src = files[newIdx] + "?t=" + Date.now();

      // 페이드 전환
      nextImg.classList.remove("hidden");
      nextImg.classList.add("visible");
      currentImg.classList.remove("visible");
      currentImg.classList.add("hidden");

      currentIdx = newIdx;
      setIdx(newIdx);
    });

    // 한국어 주석: 단축키(옵션)
    window.addEventListener("keydown", (e) => {
      if (e.key === "1") currentIdx = 0;
      if (e.key === "2") currentIdx = 1;
      if (e.key === "3") currentIdx = 2;

      if (e.key === "1" || e.key === "2" || e.key === "3") {
        const nextImg = imgB.classList.contains("hidden") ? imgB : imgA;
        const currentImg = nextImg === imgA ? imgB : imgA;

        nextImg.src = files[currentIdx] + "?t=" + Date.now();

        nextImg.classList.remove("hidden");
        nextImg.classList.add("visible");
        currentImg.classList.remove("visible");
        currentImg.classList.add("hidden");

        setIdx(currentIdx);
      }
    });
  </script>
</body>
</html>
